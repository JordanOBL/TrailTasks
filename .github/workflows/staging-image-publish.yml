name: Staging deployment

on:
  push:
    branches: [dev]

permissions:
  contents: read

# Never interrupt an apply. GitHub may replace an older pending run; stale-head
# checks below also prevent queued revisions from overwriting a newer deployment.
concurrency:
  group: trailtasks-staging-deployment
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  deploy:
    needs: quality
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_DIR: infra/terraform/environments/staging
      ECR_REGISTRY: 890129487844.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: trailtasks-api
      IMAGE_TAG: ${{ github.sha }}
      ECS_CLUSTER: trailtasks-staging
      ECS_SERVICE: trailtasks-staging-api
      EXECUTION_ROLE: arn:aws:iam::890129487844:role/trailtasks-staging-ecs-task-execution-role
      SMOKE_URL: https://api-staging.trailtasks.app/api/health

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject a superseded source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || { printf 'Refusing superseded dev revision.\n'; exit 1; }

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false

      - name: Assume staging deployment role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::890129487844:role/trailtasks-staging-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: staging-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: '890129487844'

      - name: Initialize and validate Terraform
        run: |
          terraform -chdir="$TF_DIR" fmt -check
          terraform -chdir="$TF_DIR" init -input=false -lockfile=readonly
          terraform -chdir="$TF_DIR" validate -no-color

      - name: Find previously published source image
        id: existing
        run: |
          digest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)"
          if [[ "$digest" == None ]]; then
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          elif [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'found=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Unexpected ECR image lookup result.\n' >&2
            exit 1
          fi

      - name: Log Docker into ECR
        if: steps.existing.outputs.found == 'false'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and publish source image
        if: steps.existing.outputs.found == 'false'
        run: |
          docker build --platform linux/amd64 --provenance=false \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./api-server
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Verify published image in ECR
        id: image
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf 'Invalid ECR digest.\n'; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'DEPLOY_DIGEST=%s\nDEPLOY_IMAGE=%s/%s@%s\n' \
            "$digest" "$ECR_REGISTRY" "$ECR_REPOSITORY" "$digest" >> "$GITHUB_ENV"
          printf 'Image: `%s/%s:%s`\n\nDigest: `%s`\n' \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare private runner-local plan directory
        run: |
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/staging-deploy.XXXXXX")"
          printf 'DEPLOY_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Create a refreshed plan without logging secret-bearing output
        run: |
          umask 077
          if ! terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=5m \
            -var="api_image_tag=$IMAGE_TAG" -var="api_image_digest=$DEPLOY_DIGEST" \
            -out="$DEPLOY_PRIVATE_DIR/deploy.tfplan" \
            > "$DEPLOY_PRIVATE_DIR/plan.log" 2>&1; then
            printf 'Terraform plan failed. Raw output is deliberately not published; see the deployment runbook.\n' >&2
            exit 1
          fi
          terraform -chdir="$TF_DIR" show -json "$DEPLOY_PRIVATE_DIR/deploy.tfplan" \
            > "$DEPLOY_PRIVATE_DIR/plan.json" 2> "$DEPLOY_PRIVATE_DIR/show.log"

      - name: Reject changes outside the image deployment contract
        run: |
          python3 scripts/ci/staging_deploy.py guard-plan "$DEPLOY_PRIVATE_DIR/plan.json" \
            --image "$DEPLOY_IMAGE" \
            --execution-role "$EXECUTION_ROLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject a superseded revision immediately before apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || { printf 'Refusing superseded dev revision.\n'; exit 1; }

      - name: Apply the exact validated saved plan
        run: |
          umask 077
          if ! terraform -chdir="$TF_DIR" apply -input=false -no-color -lock-timeout=5m \
            "$DEPLOY_PRIVATE_DIR/deploy.tfplan" > "$DEPLOY_PRIVATE_DIR/apply.log" 2>&1; then
            printf 'Terraform apply failed; staging may be partially changed. Follow the deployment recovery runbook.\n' >&2
            exit 1
          fi
          terraform -chdir="$TF_DIR" output -raw api_task_definition_arn \
            > "$DEPLOY_PRIVATE_DIR/expected-task-definition.txt"

      - name: Wait for ECS service stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify the intended revision and digest are actually running
        env:
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          umask 077
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            > "$DEPLOY_PRIVATE_DIR/service.json"
          tasks="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" --desired-status RUNNING --query taskArns --output text)"
          [[ -n "$tasks" && "$tasks" != None ]] || { printf 'No running service tasks.\n'; exit 1; }
          read -r -a task_arns <<< "$tasks"
          aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "${task_arns[@]}" \
            > "$DEPLOY_PRIVATE_DIR/tasks.json"
          python3 scripts/ci/staging_deploy.py verify-rollout \
            "$DEPLOY_PRIVATE_DIR/service.json" "$DEPLOY_PRIVATE_DIR/tasks.json" \
            --task-definition "$(< "$DEPLOY_PRIVATE_DIR/expected-task-definition.txt")" \
            --image "$DEPLOY_IMAGE" \
            --digest "$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the public HTTPS process-health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 20 \
            "$SMOKE_URL" > "$DEPLOY_PRIVATE_DIR/health.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if data == {"status":"ok"} else 1)' \
            "$DEPLOY_PRIVATE_DIR/health.json"
          printf 'HTTPS process-health smoke check passed. This does not prove a database query.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private plans, state-derived data, and Docker credentials
        if: always()
        run: |
          if [[ -n "${DEPLOY_PRIVATE_DIR:-}" && "$DEPLOY_PRIVATE_DIR" == "$RUNNER_TEMP"/staging-deploy.* ]]; then
            rm -rf -- "$DEPLOY_PRIVATE_DIR"
          fi
          rm -rf -- "$TF_DIR/.terraform"
          docker logout "$ECR_REGISTRY" >/dev/null 2>&1 || true
