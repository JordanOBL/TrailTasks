name: Publish staging API image

on:
  push:
    branches:
      - dev
    paths:
      - api-server/**
      - .github/workflows/staging-image-publish.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 890129487844.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: trailtasks-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assume staging role through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::890129487844:role/trailtasks-staging-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-staging-image-publish

      - name: Log Docker into ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      - name: Build API image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./api-server

      - name: Push API image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Record published image
        run: |
          printf 'Published image: %s/%s:%s\n' \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
