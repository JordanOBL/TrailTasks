name: Staging AWS Authentication

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/staging-aws-auth.yml

permissions:
  id-token: write

jobs:
  verify-aws-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assume staging role through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::890129487844:role/trailtasks-staging-github-deploy
          aws-region: us-east-1
          role-session-name: github-staging-auth-check

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify staging state object access
        run: |
          aws s3api head-object \
            --bucket trailtasks-terraform-state-890129487844 \
            --key staging/terraform.tfstate \
            --query '{Size:ContentLength,Encryption:ServerSideEncryption,VersionId:VersionId}'
