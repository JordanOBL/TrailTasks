name: Quality Gates

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix ./api-server

      - name: Run API tests
        run: npm --prefix ./api-server test

  mobile-release-gate:
    name: Mobile release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-client/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix ./mobile-client

      - name: Run mobile MVP release quality gate
        run: npm --prefix ./mobile-client run quality:release
