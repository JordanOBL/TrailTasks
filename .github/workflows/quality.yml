name: Quality Gates

on:
  workflow_call:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix ./api-server

      - name: Run API tests
        run: npm --prefix ./api-server test

  mobile-release-gate:
    name: Mobile release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-client/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix ./mobile-client

      - name: Run mobile MVP release quality gate
        run: npm --prefix ./mobile-client run quality:release

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test deployment safety contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false

      - name: Validate Terraform without AWS access
        working-directory: infra/terraform/environments/staging
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
